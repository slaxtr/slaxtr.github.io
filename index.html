<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SLAX | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ÖZEL İMLEÇ (Sadece Masaüstü) */
    @media (min-width: 1025px) {
      * { cursor: none !important; }
      .cursor-dot { width: 8px; height: 8px; background: var(--blue); position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; transition: background 0.2s ease; }
      .cursor-outline { width: 40px; height: 40px; border: 2px solid rgba(75, 125, 255, 0.5); position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9998; transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease; }
    }

    :root {
      --bg: #f4f7fb; --card: rgba(255, 255, 255, 0.9); --stroke: rgba(0,0,0,.08);
      --text: #05060b; --muted: #7d8599; --muted2: #9ba3b6; --blue: #4b7dff; --green: #1ed760;
      --shadow: 0 24px 80px rgba(0,0,0,.1); --radius: 28px; --avatar-bg: #f0f0f0;
      --avatar-border: rgba(0,0,0,.12); --rain-color: rgba(0, 0, 0, 0.25);
      --icon-bg: rgba(0,0,0,.055); --icon-text: #333;
      --btn-bg: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.02));
      --btn-border: rgba(0,0,0,.07); --btn-hover-bg: linear-gradient(180deg, rgba(80,115,255,.10), rgba(0,0,0,.035));
      --btn-hover-border: rgba(92,124,255,.42); --stat-card-bg: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.02));
      --stat-card-border: rgba(0,0,0,.06);
    }

    [data-theme="dark"] {
      --bg: #05060b; --card: rgba(18,20,31,.72); --stroke: rgba(255,255,255,.08);
      --text: #f4f7fb; --muted: #9ba3b6; --muted2: #7d8599; --shadow: 0 24px 80px rgba(0,0,0,.45);
      --avatar-bg: #111420; --avatar-border: rgba(255,255,255,.12); --rain-color: rgba(255, 255, 255, 0.35);
      --icon-bg: rgba(255,255,255,.055); --icon-text: #fff;
      --btn-bg: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      --btn-border: rgba(255,255,255,.07); --btn-hover-bg: linear-gradient(180deg, rgba(80,115,255,.10), rgba(255,255,255,.035));
      --btn-hover-border: rgba(92,124,255,.42); --stat-card-bg: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      --stat-card-border: rgba(255,255,255,.06);
    }

    /* KAYDIRMAYI AKTİF EDEN AYARLAR */
    html, body {
      width: 100%; min-height: 100vh; margin: 0; padding: 0;
      font-family: "Inter", sans-serif; color: var(--text); background-color: var(--bg);
      background-image: url('bg.jpg'); background-size: cover; background-position: center;
      background-attachment: fixed; overflow-x: hidden; overflow-y: auto;
      display: flex; align-items: center; justify-content: center;
    }

    #rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .drop { position: absolute; top: -100px; width: 2px; height: 60px; background: linear-gradient(to bottom, transparent, var(--rain-color)); animation: fall linear infinite; }
    @keyframes fall { 0% { transform: translateY(-5vh); } 100% { transform: translateY(110vh); } }

    .layout { width: min(100%, 920px); display: grid; gap: 18px; padding: 40px 20px; transition: transform 0.1s ease-out; position: relative; z-index: 10; box-sizing: border-box; }
    .card { position: relative; background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(16px); overflow: hidden; }

    .hero { padding: 26px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
    .avatar { width: 92px; height: 92px; border-radius: 24px; overflow: hidden; border: 1px solid var(--avatar-border); background: var(--avatar-bg); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: clamp(34px, 5vw, 52px); font-weight: 800; letter-spacing: -.04em; line-height: .95; }
    .verify { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; background: linear-gradient(180deg, #4f8fff, #2f6dff); font-size: 12px; font-weight: 700; color: white; margin-left: 10px; }
    .tagline { color: var(--muted); font-size: 13px; letter-spacing: .25em; text-transform: uppercase; font-weight: 600; margin-top: 8px; }
    
    .grid { display: grid; grid-template-columns: 1.15fr .95fr; gap: 18px; }
    .section { padding: 22px; }
    .links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .link-btn { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--btn-border); background: var(--btn-bg); color: var(--text); text-decoration: none; transition: all 0.3s ease; }
    .link-btn:hover { transform: translateY(-3px); border-color: var(--btn-hover-border); background: var(--btn-hover-bg); }
    .link-btn.full { grid-column: 1 / -1; }
    .icon-wrap { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: var(--icon-bg); color: var(--icon-text); }

    .status-card { padding: 18px; border-radius: 20px; background: var(--stat-card-bg); border: 1px solid var(--stat-card-border); margin-bottom: 15px; }
    .status-title { font-size: 11px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .14em; font-weight: 800; }
    .activity-container { display: flex; align-items: center; gap: 14px; }
    .activity-img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; border: 1px solid var(--avatar-border); }
    .live-badge { font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
    .badge-active { color: var(--green); }
    .badge-past { color: var(--muted); }

    /* MOBİL OPTİMİZASYONU */
    @media (max-width: 860px) {
      body { align-items: flex-start; }
      .layout { padding: 20px 15px; }
      .grid { grid-template-columns: 1fr; gap: 15px; }
      .hero { grid-template-columns: 1fr; text-align: center; }
      .avatar { margin: 0 auto; }
      .identity { display: flex; flex-direction: column; align-items: center; }
      .links { grid-template-columns: 1fr; }
      .hero-side { flex-direction: row !important; justify-content: center; flex-wrap: wrap; }
    }
  </style>
</head>
