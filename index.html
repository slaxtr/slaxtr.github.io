<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLAX | Profile v3.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ÖZEL İMLEÇ (Sadece Masaüstü) */
    @media (min-width: 801px) {
      * { cursor: none !important; }
      .cursor-dot { width: 8px; height: 8px; background: #4b7dff; position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; }
      .cursor-outline { width: 40px; height: 40px; border: 2px solid rgba(75, 125, 255, 0.5); position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9998; transition: all 0.2s ease; }
    }

    :root {
      --bg: #05060b; --card: rgba(18,20,31,.72); --stroke: rgba(255,255,255,.08);
      --text: #f4f7fb; --muted: #9ba3b6; --blue: #4b7dff; --green: #1ed760;
      --shadow: 0 24px 80px rgba(0,0,0,.45); --radius: 28px;
    }

    html, body {
      width: 100%; min-height: 100%; margin: 0; font-family: 'Inter', sans-serif;
      color: var(--text); background-color: var(--bg);
      background-image: url('./bg.jpg'); background-size: cover; background-position: center; background-attachment: fixed;
      display: flex; align-items: center; justify-content: center; overflow-x: hidden;
    }

    /* YAĞMUR EFEKTİ */
    #rain-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    .drop { position: absolute; top: -100px; width: 2px; height: 60px; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2)); animation: fall linear infinite; }
    @keyframes fall { 0% { transform: translateY(-5vh); } 100% { transform: translateY(110vh); } }

    /* LAYOUT */
    .layout { width: min(100%, 920px); display: grid; gap: 18px; padding: 20px; position: relative; z-index: 10; transition: transform 0.1s ease-out; }
    .card { background: var(--card); border: 1px solid var(--stroke); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(16px); padding: 26px; }

    /* HERO */
    .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
    .avatar { width: 92px; height: 92px; border-radius: 24px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .name { font-size: clamp(28px, 5vw, 42px); font-weight: 800; margin: 0; letter-spacing: -1.5px; }

    /* GRID & CONTENT */
    .grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; margin-top: 18px; }
    .status-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; margin-bottom: 15px; }

    /* LINKS */
    .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .link-btn { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; border: 1px solid var(--stroke); background: rgba(255,255,255,0.03); color: var(--text); text-decoration: none; transition: 0.3s ease; font-size: 14px; font-weight: 500; }
    .link-btn:hover { background: rgba(75, 125, 255, 0.1); border-color: var(--blue); transform: translateY(-3px); }

    /* STATUS CARDS */
    .status-card { padding: 18px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid var(--stroke); margin-bottom: 15px; }
    .activity-container { display: flex; align-items: center; gap: 14px; }
    .activity-img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; border: 1px solid var(--stroke); }
    .badge { font-size: 10px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 800px) {
      body { align-items: flex-start; padding-top: 20px; }
      .grid { grid-template-columns: 1fr; }
      .hero { grid-template-columns: 1fr; text-align: center; }
      .avatar { margin: 0 auto; }
      .links-grid { grid-template-columns: 1fr; }
      .layout { padding: 15px; gap: 12px; }
    }
  </style>
</head>
<body>

  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-outline" id="cursor-outline"></div>
  <div id="rain-container"></div>

  <main class="layout">
    <section class="card hero">
      <div class="avatar"><img src="./avatar.jpg" alt="SLAX"></div>
      <div>
        <h1 class="name">SLAX <span style="color:var(--blue); font-size:18px;">✓</span></h1>
        <p style="color:var(--muted); margin: 5px 0 0 0; font-size: 13px; letter-spacing: 1px; font-weight: 500;">THANK GOD, I BREATHE</p>
      </div>
      <div style="font-size: 10px; padding: 8px 16px; border: 1px solid var(--stroke); border-radius: 99px; font-weight: 700; opacity: 0.8;">OFFICIAL</div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="status-title">Connect</div>
        <div class="links-grid">
          <a href="https://www.instagram.com/99slax/" target="_blank" class="link-btn">Instagram</a>
          <a href="https://www.tiktok.com/@slax994" target="_blank" class="link-btn">TikTok</a>
          <a href="https://steamcommunity.com/id/slax1/" target="_blank" class="link-btn">Steam</a>
          <a href="https://discord.com/users/1429063669186302103" target="_blank" class="link-btn">Discord</a>
        </div>
      </section>

      <section class="card">
        <div class="status-title">Live Status</div>
        
        <div class="status-card">
          <div class="status-title" style="font-size:9px;">Spotify</div>
          <div id="spotify-status">Dinlenmiyor</div>
        </div>

        <div class="status-card">
          <div class="status-title" style="font-size:9px;">Oyun Durumu</div>
          <div id="game-status">Oyun oynamıyor</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    // MOUSE FOLLOW (Desktop Only)
    if (window.innerWidth > 800) {
      const dot = document.getElementById('cursor-dot');
      const outline = document.getElementById('cursor-outline');
      window.addEventListener('mousemove', (e) => {
        dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
        outline.style.left = e.clientX + 'px'; outline.style.top = e.clientY + 'px';
      });
    }

    // RAIN EFFECT
    const rain = document.getElementById('rain-container');
    for (let i = 0; i < 35; i++) {
      const drop = document.createElement('div'); drop.classList.add('drop');
      drop.style.left = Math.random() * 100 + 'vw';
      drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
      drop.style.animationDelay = Math.random() * 2 + 's';
      rain.appendChild(drop);
    }

    // LANYARD DATA
    const myLogos = {
      "counter-strike 2": "./cs.jpg",
      "valorant": "./valorant.png",
      "grand theft auto v": "./gtav.jpg",
      "minecraft": "./minecraft.jpg",
      "roblox": "./roblox.jpg",
      "pubg: battlegrounds": "./pubg.png"
    };

    async function updateStatus() {
      try {
        const res = await fetch('https://api.lanyard.rest/v1/users/1429063669186302103');
        const { data } = await res.json();
        
        // Spotify Update
        const sp = document.getElementById("spotify-status");
        if (data.listening_to_spotify) {
          sp.innerHTML = `<div class="activity-container"><img src="${data.spotify.album_art_url}" class="activity-img"><div><div class="badge" style="color:var(--green)">Dinliyor</div><div style="font-weight:700; font-size:14px;">${data.spotify.song}</div><div style="font-size:12px; color:var(--muted)">${data.spotify.artist}</div></div></div>`;
        } else { sp.innerHTML = "Spotify kapalı"; }

        // Game Update
        const g = document.getElementById("game-status");
        const act = data.activities.find(a => a.type === 0);
        if (act) {
          const name = act.name.toLowerCase();
          const img = myLogos[name] || (act.assets ? `https://cdn.discordapp.com/app-assets/${act.application_id}/${act.assets.large_image}.png` : "./avatar.jpg");
          g.innerHTML = `<div class="activity-container"><img src="${img}" class="activity-img"><div><div class="badge" style="color:var(--blue)">Oynuyor</div><div style="font-weight:700;">${act.name}</div></div></div>`;
        } else { g.innerHTML = "Şu an boşta"; }
      } catch (e) { console.error(e); }
    }

    updateStatus();
    setInterval(updateStatus, 10000);

    // 3D TILT EFFECT (Desktop Only)
    if (window.innerWidth > 800) {
      const layout = document.querySelector('.layout');
      document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.pageX) / 45;
        const y = (window.innerHeight / 2 - e.pageY) / 45;
        layout.style.transform = `perspective(1000px) rotateY(${x}deg) rotateX(${-y}deg)`;
      });
    }
  </script>
</body>
</html>
